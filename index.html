<style>
:root{--cream:#FBF7EF;--sand:#F2E9D6;--line:#E4D8BF;--dark:#1C1509;--ink:#3d3322;--muted:#7a6a4f;--gold:#C79A3A;--gold2:#E9C85B;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Montserrat','Noto Sans SC',system-ui,sans-serif;background:var(--cream);color:var(--dark);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.top .brand{font-weight:800;font-size:13px;letter-spacing:.6px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.langs{display:flex;gap:4px;background:rgba(20,14,6,.45);backdrop-filter:blur(6px);border-radius:999px;padding:4px}
.langs button{border:0;background:transparent;color:#fff;font-weight:700;font-size:12px;padding:6px 11px;border-radius:999px}
.langs button.on{background:var(--gold2);color:var(--dark)}

/* hero */
.hero{position:relative;min-height:88vh;display:flex;align-items:flex-end;color:#fff;background:#2a1f10 url(assets/hero.jpg) center 30%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,12,4,.35) 0%,rgba(20,12,4,0) 22%,rgba(20,12,4,.15) 45%,rgba(20,12,4,.82) 78%,rgba(20,12,4,.94) 100%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:42px;padding-top:120px}
.hero .eyebrow{text-shadow:0 1px 8px rgba(0,0,0,.65)}
.eyebrow{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2)}
.hero h1{font-size:clamp(30px,7.4vw,48px);font-weight:800;line-height:1.08;letter-spacing:-1px;margin:10px 0 14px;text-shadow:3px 4px 0 rgba(20,14,6,.45)}
.hero h1 .g{color:var(--gold2)}
.hero p{font-size:16px;font-weight:500;max-width:560px;opacity:.95}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{border:0;border-radius:999px;padding:15px 22px;font-weight:800;font-size:15px;letter-spacing:-.2px;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold2);color:var(--dark);box-shadow:0 6px 20px rgba(233,200,91,.35)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.7)}
.btn-dark{background:var(--dark);color:#fff}
.btn-line{background:#fff;color:var(--dark);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.note{margin-top:14px;font-size:12.5px;font-weight:600;opacity:.8}

/* trust + how */
.trust{background:var(--dark);color:#fff}
.trust ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;padding:14px 20px;font-size:12.5px;font-weight:700}
.trust li:before{content:"✦";color:var(--gold2);margin-right:7px}
section.how{padding:44px 0 10px}
h2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:18px}
.steps3{display:grid;gap:12px}
.s3{display:grid;grid-template-columns:42px 1fr;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.s3 b{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--sand);color:var(--gold);font-weight:800}
.s3 h3{font-size:15.5px;font-weight:800}
.s3 p{font-size:13.5px;color:var(--muted);margin-top:2px}

/* app card */
#app{scroll-margin-top:12px;padding:30px 0 50px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 20px;box-shadow:0 10px 40px rgba(60,40,10,.06)}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.bar{flex:1;height:6px;background:var(--sand);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .35s}
.count{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.q{font-size:clamp(21px,5.4vw,26px);font-weight:800;letter-spacing:-.5px;line-height:1.2}
.hint{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;font-weight:600;color:var(--dark);transition:border-color .15s,background .15s}
.opt:hover{border-color:#d4c29c}
.opt .tick{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #cdbb95;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.opt.multi .tick{border-radius:6px}
.opt.on{border-color:var(--gold);background:#FBF3DF}
.opt.on .tick{background:var(--gold);border-color:var(--gold)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}
.link{background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;padding:10px 4px}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* gate */
.teaser{display:grid;gap:8px;margin:18px 0 22px}
.teaser div{display:flex;align-items:center;gap:10px;background:var(--cream);border:1px dashed #d9c9a6;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14.5px}
.teaser div:before{content:"🔒";font-size:14px}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input.in,select.in{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:15px;background:#fff;color:var(--dark)}
input.in:focus,select.in:focus{outline:none;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13.5px}
.chip.on{border-color:var(--gold);background:#FBF3DF}
.consent{display:grid;grid-template-columns:22px 1fr;gap:10px;margin-top:18px;font-size:12.5px;color:var(--ink);line-height:1.45}
.consent input{width:20px;height:20px;accent-color:var(--gold);margin-top:2px}
.err{color:#b3261e;font-size:12.5px;font-weight:700;margin-top:6px}
.banner{background:#FFF4D6;border:1px solid #efd58a;color:#6b5210;font-size:12.5px;font-weight:700;border-radius:12px;padding:10px 12px;margin-bottom:16px}
.hp{position:absolute;left:-9999px}

/* result */
.profile{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.profile span{background:var(--sand);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700}
.profile span em{font-style:normal;color:var(--muted);font-weight:600;margin-right:4px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;background:#fff}
.pcard h3{font-size:16.5px;font-weight:800;display:flex;gap:8px;align-items:flex-start}
.pcard h3:before{content:"";flex:0 0 10px;height:10px;border-radius:50%;background:var(--gold);margin-top:7px}
.pcard p{font-size:14px;color:var(--ink);margin-top:6px}
.pcard .ask{margin-top:10px;background:var(--cream);border-radius:12px;padding:10px 12px}
.pcard .ask b{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.pcard .ask li{font-size:13.5px;margin:4px 0 0 18px}
.pcard.concierge{background:var(--dark);color:#fff;border-color:var(--dark)}
.pcard.concierge p{color:rgba(255,255,255,.85)}
.next{margin-top:24px;background:var(--sand);border-radius:16px;padding:18px}
.next h3{font-size:16px;font-weight:800}
.next p{font-size:14px;margin-top:4px;font-weight:600}
.next ol{margin:10px 0 0 20px;font-size:14px}
.next li{margin-top:4px}
.actions{display:grid;gap:10px;margin-top:20px}
.actions .btn{width:100%;text-align:center;text-decoration:none;display:block}
.small{font-size:12.5px;color:var(--muted)}

footer{background:var(--dark);color:rgba(255,255,255,.75);padding:34px 0 40px;font-size:12px;text-align:center}
footer img{width:150px;margin-bottom:14px;background:rgba(255,250,240,.92);border-radius:14px;padding:10px 14px}
footer p{max-width:560px;margin:8px auto 0}

@media(min-width:680px){
 .steps3{grid-template-columns:repeat(3,1fr)}
 .s3{grid-template-columns:1fr}
 .card{padding:34px 34px}
 .actions{grid-template-columns:1fr 1fr}
}
</style>
</head>

const STEPS = [
 {id:"for",type:"single",opts:["self","parent","spouse","other"]},
 {id:"age",type:"single",opts:["u40","a40","a55","a65"]},
 {id:"goal",type:"multi",exclusive:"unsure",opts:["treat","prevent","active","vitality","younger","recover","peace","unsure"]},
 {id:"areas",type:"multi",opts:["joints","energy","ageing","chronic","hair","skin","sensitive","men","women","cancer"]},
 {id:"duration",type:"single",opts:["lt3","m3_12","gt12","na"]},
 {id:"impact",type:"single",opts:["none","mild","moderate","severe"]},
 {id:"health",type:"multi",exclusive:"none",opts:["famcancer","treated","cond","meds","none"]},
 {id:"reports",type:"single",opts:["rep","norep","no"]},
 {id:"time",type:"single",opts:["m1","m3","m6","explore"]}
];

const params = new URLSearchParams(location.search);
const S = {
  lang: pickLang(), ref: (params.get("ref")||"DIRECT").toUpperCase().slice(0,40),
  view: "idle", step: 0, answers: {}, lovedOne: false, contact: {name:"",phone:"",email:"",country:"",via:"wa"},
  errors: {}, sending: false, sendError: false, testMode: false
};

function pickLang(){
  const p=(params.get("lang")||"").toLowerCase();
  if(["en","id","zh"].includes(p)) return p;
  const n=(navigator.language||"en").toLowerCase();
  return n.startsWith("id")||n.startsWith("ms")?"id":n.startsWith("zh")?"zh":"en";
}
const T = () => I18N[S.lang];
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fill = (s,o) => s.replace(/\{(\w+)\}/g,(_,k)=>o[k]??"");
const isOther = () => S.answers.for ? S.answers.for!=="self" : S.lovedOne;

function qText(id){ const q=T().q[id]; return (isOther() && q.other) ? q.other : q.self; }

/* ---------- static page text ---------- */
function renderStatic(){
  document.documentElement.lang = S.lang==="zh"?"zh-Hans":S.lang;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v=T()[el.dataset.t]; if(v==null) return;
    if(el.hasAttribute("data-html")) el.innerHTML=v; else el.textContent=v;
  });
  document.getElementById("trust").innerHTML=T().trust.map(x=>`<li>${esc(x)}</li>`).join("");
  document.getElementById("how").innerHTML=T().how.map((h,i)=>`<div class="s3"><b>${i+1}</b><div><h3>${esc(h[0])}</h3><p>${esc(h[1])}</p></div></div>`).join("");
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===S.lang));
}

/* ---------- logic ---------- */
function pathways(){
  const a=S.answers, list=[...(a.areas||[])];
  const h=a.health||[];
  if((h.includes("famcancer")||h.includes("treated")||(a.goal||[]).includes("peace")) && !list.includes("cancer")) list.push("cancer");
  if(!list.length) list.push("ageing");
  return list;
}
function tier(){ return {m1:"HOT",m3:"WARM",m6:"WARM",explore:"COLD"}[S.answers.time]||"WARM"; }
function priority(){
  const a=S.answers;
  return (a.health||[]).includes("treated") || a.reports==="rep" || (a.areas||[]).includes("chronic");
}

/* ---------- views ---------- */
const app = document.getElementById("app");
function render(){
  renderStatic();
  if(S.view==="idle"){ app.innerHTML=""; return; }
  if(S.view==="quiz") return renderQuiz();
  if(S.view==="gate") return renderGate();
  if(S.view==="result") return renderResult();
}

function visibleOpts(step){
  return (step.id==="for" && S.lovedOne) ? step.opts.filter(o=>o!=="self") : step.opts;
}

function renderQuiz(){
  const step=STEPS[S.step], t=T(), total=STEPS.length, val=S.answers[step.id];
  const multi=step.type==="multi";
  const opts=visibleOpts(step).map(o=>{
    const on = multi ? (val||[]).includes(o) : val===o;
    return `<button class="opt ${multi?"multi":""} ${on?"on":""}" data-o="${o}"><span class="tick">${on?"✓":""}</span><span>${esc(t.q[step.id].opts[o])}</span></button>`;
  }).join("");
  const canNext = multi ? (val||[]).length>0 : !!val;
  app.innerHTML=`<div class="card fade">
    <div class="prog"><div class="bar"><i style="width:${Math.round((S.step)/total*100)}%"></i></div><span class="count">${esc(fill(t.step_of,{n:S.step+1,t:total}))}</span></div>
    <div class="q">${esc(qText(step.id))}</div>
    ${multi?`<div class="hint">${esc(t.multi_hint)}</div>`:""}
    <div class="opts">${opts}</div>
    <div class="nav">
      <button class="link" id="back">${S.step>0?"← "+esc(t.back):""}</button>
      ${multi||val?`<button class="btn btn-dark" id="next" ${canNext?"":"disabled"}>${esc(t.next)} →</button>`:""}
    </div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(step,b.dataset.o));
  const bk=document.getElementById("back"); if(bk) bk.onclick=()=>{ if(S.step>0){S.step--;render();scrollApp();} };
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>advance();
}

function choose(step,o){
  if(step.type==="multi"){
    let v=[...(S.answers[step.id]||[])];
    if(step.exclusive && o===step.exclusive) v = v.includes(o)?[]:[o];
    else { v=v.filter(x=>x!==step.exclusive); v=v.includes(o)?v.filter(x=>x!==o):[...v,o]; }
    S.answers[step.id]=v; render();
  } else {
    S.answers[step.id]=o; render();
    setTimeout(advance,220);
  }
}
function advance(){
  const step=STEPS[S.step], v=S.answers[step.id];
  if(step.type==="multi" ? !(v&&v.length) : !v) return;
  if(S.step<STEPS.length-1){ S.step++; } else { S.view="gate"; }
  render(); scrollApp();
}
function scrollApp(){ app.scrollIntoView({behavior:"smooth",block:"start"}); }

function renderGate(){
  const t=T(), P=pathways(), c=S.contact, e=S.errors;
  const vias=[["wa",t.c_wa],["call",t.c_call],["email",t.c_email]];
  app.innerHTML=`<div class="card fade">
    <div class="prog"><div class="bar"><i style="width:100%"></i></div><span class="count">✓</span></div>
    <span class="eyebrow" style="color:var(--gold)">${esc(t.gate_eyebrow)}</span>
    <div class="q" style="margin-top:6px">${esc(P.length===1?t.gate_h1:fill(t.gate_h,{n:P.length}))}</div>
    <div class="teaser">${P.map(k=>`<div>${esc(t.P[k][0])}</div>`).join("")}</div>
    <p class="small">${esc(t.gate_p)}</p>
    <form id="lead" novalidate>
      <label class="f" for="name">${esc(t.f_name)}</label>
      <input class="in" id="name" autocomplete="name" value="${esc(c.name)}">
      ${e.name?`<div class="err">${esc(t.err_required)}</div>`:""}
      <label class="f" for="phone">${esc(t.f_phone)}</label>
      <input class="in" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="${esc(t.f_phone_ph)}" value="${esc(c.phone)}">
      ${e.phone?`<div class="err">${esc(e.phone==="req"?t.err_required:t.err_phone)}</div>`:""}
      <label class="f" for="country">${esc(t.f_country)}</label>
      <input class="in" id="country" autocomplete="country-name" placeholder="${esc(t.f_country_ph)}" value="${esc(c.country)}">
      ${e.country?`<div class="err">${esc(t.err_required)}</div>`:""}
      <label class="f" for="email">${esc(t.f_email)}</label>
      <input class="in" id="email" type="email" autocomplete="email" value="${esc(c.email)}">
      ${e.email?`<div class="err">${esc(t.err_email)}</div>`:""}
      <label class="f">${esc(t.f_contact)}</label>
      <div class="chips">${vias.map(([k,l])=>`<button type="button" class="chip ${c.via===k?"on":""}" data-via="${k}">${esc(l)}</button>`).join("")}</div>
      <label class="consent"><input type="checkbox" id="consent" ${c.consent?"checked":""}><span>${esc(t.consent)}</span></label>
      ${e.consent?`<div class="err">${esc(t.err_consent)}</div>`:""}
      <input type="checkbox" name="botcheck" id="botcheck" class="hp" tabindex="-1" autocomplete="off">
      ${S.sendError?`<div class="err" style="margin-top:14px">${esc(t.err_submit)}</div>`:""}
      <div class="nav">
        <button type="button" class="link" id="back">← ${esc(t.back)}</button>
        <button type="submit" class="btn btn-gold" ${S.sending?"disabled":""}>${esc(S.sending?t.sending:t.submit)}</button>
      </div>
    </form></div>`;
  const keep=()=>{ ["name","phone","country","email"].forEach(k=>c[k]=document.getElementById(k).value.trim()); c.consent=document.getElementById("consent").checked; };
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ keep(); c.via=b.dataset.via; render(); });
  document.getElementById("back").onclick=()=>{ keep(); S.view="quiz"; S.step=STEPS.length-1; render(); scrollApp(); };
  document.getElementById("lead").onsubmit=ev=>{ ev.preventDefault(); keep(); submitLead(); };
}

function validate(){
  const c=S.contact, e={};
  if(!c.name) e.name=1;
  if(!c.phone) e.phone="req"; else if(!/^\+\d[\d\s\-()]{6,}$/.test(c.phone)) e.phone="fmt";
  if(!c.country) e.country=1;
  if(c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) e.email=1;
  if(!c.consent) e.consent=1;
  S.errors=e; return !Object.keys(e).length;
}

function payload(){
  const en=I18N.en, a=S.answers, c=S.contact, P=pathways(), tr=tier(), pr=priority();
  const lab=(id,v)=>Array.isArray(v)?v.map(x=>en.q[id].opts[x]).join("; "):(en.q[id].opts[v]||"");
  return {
    access_key: CONFIG.WEB3FORMS_ACCESS_KEY,
    subject: `${pr?"PRIORITY · ":""}${tr} · Health Discovery · ${c.name} (${c.country})`,
    from_name: "Caresbridge Health Discovery",
    botcheck: document.getElementById("botcheck")?.checked || false,
    name: c.name, email: c.email || undefined, phone: c.phone, country_city: c.country,
    contact_via: {wa:"WhatsApp message",call:"WhatsApp call",email:"Email"}[c.via],
    tier: tr, priority: pr?"PRIORITY":"", reference: S.ref, language: S.lang,
    for_whom: lab("for",a.for), age_range: lab("age",a.age), goal: lab("goal",a.goal),
    areas_of_interest: lab("areas",a.areas), duration: lab("duration",a.duration), daily_impact: lab("impact",a.impact),
    health_flags: lab("health",a.health), tests_reports: lab("reports",a.reports), timeframe: lab("time",a.time),
    matched_pathways: P.map(k=>en.P[k][0]).join("; "),
    consent: "Yes", submitted_at: new Date().toISOString(), page: location.href.split("#")[0]
  };
}

/* Funnel answers -> Google Form answers */
function gformParams(){
  const a=S.answers, c=S.contact, en=I18N.en, E=GFORM.entry, p=new URLSearchParams();
  const add=(k,v)=>{ if(v!==undefined && v!=="") p.append("entry."+E[k], v); };
  const goals=a.goal||[];
  const treatish=goals.some(g=>["treat","recover"].includes(g));
  const prevish=goals.some(g=>["prevent","active","vitality","younger","peace"].includes(g));
  const goal = goals.includes("unsure") ? "unsure" : treatish&&prevish ? "both" : treatish ? "treat" : prevish ? "prevent" : "unsure";
  const areaMap={joints:"joints",energy:"wellness",ageing:"wellness",chronic:"chronic",hair:"hair",skin:"skin",sensitive:"skin",men:"men",women:"women",cancer:"cancer"};
  const areas=[...new Set((a.areas||[]).map(x=>areaMap[x]).filter(Boolean))];
  const lab=(id,v)=>Array.isArray(v)?v.map(x=>en.q[id].opts[x]).join("; "):(en.q[id].opts[v]||"");
  add("name", c.name); add("whatsapp", c.phone); add("country", c.country);
  add("age", GFORM.age[a.age]);
  add("forWhom", a.for==="self" ? GFORM.forWhom.self : GFORM.forWhom.family);
  add("language", GFORM.language[S.lang]);
  add("goal", GFORM.goal[goal]);
  (areas.length?areas:["wellness"]).forEach(k=>add("areas", GFORM.areas[k]));
  add("concern", `[Health Discovery] For: ${lab("for",a.for)} | Goals: ${lab("goal",a.goal)} | Areas: ${lab("areas",a.areas)} | Daily impact: ${lab("impact",a.impact)} | Matched: ${pathways().map(k=>en.P[k][0]).join("; ")}`);
  add("duration", GFORM.duration[a.duration]);
  add("reports", GFORM.reports[a.reports]);
  (a.health&&a.health.length?a.health:["none"]).forEach(k=>add("health", GFORM.health[k]));
  add("time", GFORM.time[a.time]);
  add("contact", GFORM.contact[c.via]);
  add("email", c.email);
  add("consent", GFORM.consent);
  add("reference", "DISCOVERY-"+S.ref);
  p.append("fvv","1"); p.append("pageHistory", GFORM.sections);
  return p;
}
function sendToGoogleForm(){
  if(!CONFIG.GOOGLE_FORM_ID) return Promise.resolve();
  return fetch(`https://docs.google.com/forms/d/e/${CONFIG.GOOGLE_FORM_ID}/formResponse`,
    {method:"POST", mode:"no-cors", body:gformParams()}).catch(err=>console.warn("Google Form copy failed", err));
}

async function submitLead(){
  if(!validate()){ S.sendError=false; render(); return; }
  if(document.getElementById("botcheck")?.checked) return;
  const data=payload();
  if(!CONFIG.WEB3FORMS_ACCESS_KEY || CONFIG.WEB3FORMS_ACCESS_KEY.startsWith("YOUR_")){
    console.info("[Test mode] lead payload:", data);
    S.testMode=true; S.view="result"; render(); scrollApp(); return;
  }
  S.sending=true; S.sendError=false; render();
  const sheetCopy = sendToGoogleForm();   // runs alongside the email; never blocks the visitor
  try{
    const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok || !j.success) throw new Error(j.message||r.status);
    await sheetCopy;
    S.sending=false; S.view="result"; render(); scrollApp();
  }catch(err){
    console.error(err); S.sending=false; S.sendError=true; render();
  }
}

  document.getElementById("restart").onclick=()=>{ S.answers={}; S.step=0; S.lovedOne=false; S.testMode=false; S.errors={}; S.view="idle"; render(); window.scrollTo({top:0,behavior:"smooth"}); };
}
